[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov"
markers = [
    "live_infra: exercises real Postgres and Redis paths using isolated test infrastructure",
]

[tool.coverage.run]
branch = true
omit = [
    "app/migrations/*",
    "tests/*",
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
    "B904",  # raise from within except (too noisy for existing code)
    "SIM108", # ternary operator (readability preference)
    "UP006", "UP007", "UP035",  # keep Python 3.10-compatible type annotations
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SIM117", "UP007"]
# SQLAlchemy relationship forward references in string annotations are valid Python —
# the F821 "undefined name" flag is a false positive for these patterns.
"app/models/**" = ["F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
