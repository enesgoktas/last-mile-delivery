services:
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    ports:
      - "5001:5000"
    volumes:
      - ./osrm_data/car:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/Istanbul.osrm.names ]; then
          echo "ERROR: Car OSRM data not found in /data/."
          echo "Run 'bash scripts/prepare_osrm_data.sh' from the backend/ directory first."
          exit 1
        fi
        exec osrm-routed --algorithm mld /data/Istanbul.osrm --port 5000 --max-table-size 200
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5000' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  osrm-truck:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    ports:
      - "5002:5000"
    volumes:
      - ./osrm_data/truck:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/Istanbul.osrm.names ]; then
          echo "ERROR: Truck OSRM data not found in /data/."
          echo "Run 'bash scripts/prepare_osrm_data.sh' from the backend/ directory first."
          exit 1
        fi
        exec osrm-routed --algorithm mld /data/Istanbul.osrm --port 5000 --max-table-size 200
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5000' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://delivery:delivery@postgres:5432/delivery_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET env var must be set}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - OSRM_BASE_URL=http://osrm-car:5000
      - OSRM_PROFILE_BASE_URLS={"driving":"http://osrm-car:5000","motorcycle":"http://osrm-car:5000","truck":"http://osrm-truck:5000"}
      - PHOTON_BASE_URL=${PHOTON_BASE_URL:-https://photon.komoot.io}
      - OPEN_CHARGE_MAP_API_KEY=${OPEN_CHARGE_MAP_API_KEY:-}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm-car:
        condition: service_healthy
      osrm-truck:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q celery,optimization,notifications,operations,integrations,geofencing
    environment:
      - DATABASE_URL=postgresql+asyncpg://delivery:delivery@postgres:5432/delivery_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - OSRM_BASE_URL=http://osrm-car:5000
      - OSRM_PROFILE_BASE_URLS={"driving":"http://osrm-car:5000","motorcycle":"http://osrm-car:5000","truck":"http://osrm-truck:5000"}
      - PHOTON_BASE_URL=${PHOTON_BASE_URL:-https://photon.komoot.io}
      - OPEN_CHARGE_MAP_API_KEY=${OPEN_CHARGE_MAP_API_KEY:-}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm-car:
        condition: service_healthy
      osrm-truck:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery_beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid
    environment:
      - DATABASE_URL=postgresql+asyncpg://delivery:delivery@postgres:5432/delivery_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - OSRM_BASE_URL=http://osrm-car:5000
      - OSRM_PROFILE_BASE_URLS={"driving":"http://osrm-car:5000","motorcycle":"http://osrm-car:5000","truck":"http://osrm-truck:5000"}
      - PHOTON_BASE_URL=${PHOTON_BASE_URL:-https://photon.komoot.io}
      - OPEN_CHARGE_MAP_API_KEY=${OPEN_CHARGE_MAP_API_KEY:-}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm-car:
        condition: service_healthy
      osrm-truck:
        condition: service_healthy
    healthcheck:
      # Beat doesn't respond to inspect ping — check that the pidfile is written instead.
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: delivery_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U delivery -d delivery_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  photon:
    image: chhengkim/photon:0.4.4
    platform: linux/amd64
    profiles: ["geocoding"]
    ports:
      - "2322:2322"
    command: ["-host", "0.0.0.0", "-port", "2322"]
    volumes:
      - photon_data:/photon/photon_data
    # Optional local geocoder service.
    # Requires photon index data mounted at /photon/photon_data/elasticsearch.
    # Run only when needed:
    #   docker compose --profile geocoding up -d photon

volumes:
  pgdata:
  photon_data:
