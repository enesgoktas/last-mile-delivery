name: mobile-cd

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: "Target platform"
        required: true
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: mobile-cd-${{ github.event.inputs.profile }}-${{ github.event.inputs.platform }}
  cancel-in-progress: false

jobs:
  eas-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.typecheck.json

      - name: Unit tests
        run: npm test

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Ensure EAS token is set
        run: |
          [ -n "${{ secrets.EXPO_TOKEN }}" ] || { echo "Missing EXPO_TOKEN secret"; exit 1; }

      - name: EAS Build
        run: |
          eas build \
            --profile "${{ github.event.inputs.profile }}" \
            --platform "${{ github.event.inputs.platform }}" \
            --non-interactive \
            --no-wait
        env:
          # EXPO_TOKEN is consumed by the EAS CLI automatically
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Collect build summary
        if: always()
        run: |
          {
            echo "profile=${{ github.event.inputs.profile }}"
            echo "platform=${{ github.event.inputs.platform }}"
            echo "commit_sha=${GITHUB_SHA}"
          } > ../mobile-cd-summary.txt

      - name: Upload build summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-cd-${{ github.event.inputs.profile }}-${{ github.run_id }}
          path: mobile-cd-summary.txt
