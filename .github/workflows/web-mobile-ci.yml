name: web-mobile-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "tracking/**"
      - "mobile/**"
      - ".github/workflows/web-mobile-ci.yml"
      - ".github/workflows/reusable-web-mobile-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "tracking/**"
      - "mobile/**"
      - ".github/workflows/web-mobile-ci.yml"
      - ".github/workflows/reusable-web-mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: web-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-reusable:
    uses: ./.github/workflows/reusable-web-mobile-ci.yml
