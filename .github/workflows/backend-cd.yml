name: backend-cd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: backend-cd-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.environment }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_API_SERVICE: ${{ secrets.ECS_API_SERVICE }}
      ECS_WORKER_SERVICE: ${{ secrets.ECS_WORKER_SERVICE }}
      ECR_BACKEND_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
      ECR_WORKER_REPOSITORY: ${{ secrets.ECR_WORKER_REPOSITORY }}
      CODEDEPLOY_API_APPLICATION: ${{ secrets.CODEDEPLOY_API_APPLICATION }}
      CODEDEPLOY_API_DEPLOYMENT_GROUP: ${{ secrets.CODEDEPLOY_API_DEPLOYMENT_GROUP }}
      ECS_MIGRATION_TASK_DEFINITION_ARN: ${{ secrets.ECS_MIGRATION_TASK_DEFINITION_ARN }}
      ECS_SUBNETS_CSV: ${{ secrets.ECS_SUBNETS_CSV }}
      ECS_SECURITY_GROUPS_CSV: ${{ secrets.ECS_SECURITY_GROUPS_CSV }}
      API_HEALTHCHECK_URL: ${{ secrets.API_HEALTHCHECK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure required deployment secrets exist
        run: |
          [ -n "${{ secrets.AWS_REGION }}" ] || { echo "Missing AWS_REGION"; exit 1; }
          [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ] || { echo "Missing AWS_ROLE_TO_ASSUME"; exit 1; }
          [ -n "${{ secrets.ECS_CLUSTER }}" ] || { echo "Missing ECS_CLUSTER"; exit 1; }
          [ -n "${{ secrets.ECS_API_SERVICE }}" ] || { echo "Missing ECS_API_SERVICE"; exit 1; }
          [ -n "${{ secrets.ECS_WORKER_SERVICE }}" ] || { echo "Missing ECS_WORKER_SERVICE"; exit 1; }
          [ -n "${{ secrets.ECR_BACKEND_REPOSITORY }}" ] || { echo "Missing ECR_BACKEND_REPOSITORY"; exit 1; }
          [ -n "${{ secrets.ECR_WORKER_REPOSITORY }}" ] || { echo "Missing ECR_WORKER_REPOSITORY"; exit 1; }
          [ -n "${{ secrets.CODEDEPLOY_API_APPLICATION }}" ] || { echo "Missing CODEDEPLOY_API_APPLICATION"; exit 1; }
          [ -n "${{ secrets.CODEDEPLOY_API_DEPLOYMENT_GROUP }}" ] || { echo "Missing CODEDEPLOY_API_DEPLOYMENT_GROUP"; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        id: build-api
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
          # Use inline cache embedded in the image manifest — no extra cache registry needed.
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:cache,mode=max

      - name: Export API image URI
        run: echo "API_IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        id: build-worker
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_WORKER_REPOSITORY }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_WORKER_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_WORKER_REPOSITORY }}:cache,mode=max

      - name: Export worker image URI
        run: echo "WORKER_IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_WORKER_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Register worker task definition revision
        run: |
          set -euo pipefail
          CURRENT_WORKER_TASK_DEF_ARN="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_WORKER_TASK_DEF_ARN" \
            --query 'taskDefinition' > worker-taskdef-current.json

          jq --arg image "$WORKER_IMAGE_URI" '
            .containerDefinitions |= map(
              if .name == "worker" then .image = $image else . end
            )
            | del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' worker-taskdef-current.json > worker-taskdef-next.json

          NEW_WORKER_TASK_DEF_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://worker-taskdef-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "NEW_WORKER_TASK_DEF_ARN=$NEW_WORKER_TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Deploy worker service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --task-definition "$NEW_WORKER_TASK_DEF_ARN" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE"

      - name: Register API task definition revision
        run: |
          set -euo pipefail
          CURRENT_API_TASK_DEF_ARN="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_API_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_API_TASK_DEF_ARN" \
            --query 'taskDefinition' > api-taskdef-current.json

          API_CONTAINER_PORT="$(jq -r '.containerDefinitions[] | select(.name == "api") | .portMappings[0].containerPort // empty' api-taskdef-current.json)"
          if [[ -z "$API_CONTAINER_PORT" ]]; then
            echo "Unable to resolve API container port from current task definition."
            exit 1
          fi
          echo "API_CONTAINER_PORT=$API_CONTAINER_PORT" >> "$GITHUB_ENV"

          jq --arg image "$API_IMAGE_URI" '
            .containerDefinitions |= map(
              if .name == "api" then .image = $image else . end
            )
            | del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' api-taskdef-current.json > api-taskdef-next.json

          NEW_API_TASK_DEF_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://api-taskdef-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "NEW_API_TASK_DEF_ARN=$NEW_API_TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Run migration task (optional, blocking)
        if: env.ECS_MIGRATION_TASK_DEFINITION_ARN != ''
        run: |
          set -euo pipefail
          [ -n "$ECS_SUBNETS_CSV" ] || { echo "Missing ECS_SUBNETS_CSV for migration task"; exit 1; }
          [ -n "$ECS_SECURITY_GROUPS_CSV" ] || { echo "Missing ECS_SECURITY_GROUPS_CSV for migration task"; exit 1; }

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$ECS_MIGRATION_TASK_DEFINITION_ARN" \
            --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS_CSV],securityGroups=[$ECS_SECURITY_GROUPS_CSV],assignPublicIp=DISABLED}" \
            --count 1 \
            --query 'tasks[0].taskArn' \
            --output text)

          if [[ -z "$TASK_ARN" || "$TASK_ARN" == "None" ]]; then
            echo "Migration task did not start."
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [[ "$EXIT_CODE" != "0" ]]; then
            echo "Migration task failed with exit code $EXIT_CODE"
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
            exit 1
          fi

      - name: Create CodeDeploy deployment (API blue/green)
        run: |
          set -euo pipefail
          cat > appspec.json <<'APPSPEC'
          {
            "version": 1,
            "Resources": [
              {
                "TargetService": {
                  "Type": "AWS::ECS::Service",
                  "Properties": {
                    "TaskDefinition": "__TASK_DEFINITION__",
                    "LoadBalancerInfo": {
                      "ContainerName": "api",
                      "ContainerPort": __CONTAINER_PORT__
                    }
                  }
                }
              }
            ]
          }
          APPSPEC

          sed -i "s|__TASK_DEFINITION__|$NEW_API_TASK_DEF_ARN|g" appspec.json
          sed -i "s|__CONTAINER_PORT__|$API_CONTAINER_PORT|g" appspec.json
          APPSPEC_CONTENT="$(jq -c . appspec.json)"

          jq -n \
            --arg app "$CODEDEPLOY_API_APPLICATION" \
            --arg group "$CODEDEPLOY_API_DEPLOYMENT_GROUP" \
            --arg content "$APPSPEC_CONTENT" \
            '{
              applicationName: $app,
              deploymentGroupName: $group,
              revision: {
                revisionType: "AppSpecContent",
                appSpecContent: { content: $content }
              },
              description: "GitHub Actions deployment " + env.GITHUB_SHA
            }' > codedeploy-request.json

          DEPLOYMENT_ID="$(aws deploy create-deployment \
            --cli-input-json file://codedeploy-request.json \
            --query 'deploymentId' \
            --output text)"

          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Wait for CodeDeploy deployment success
        run: |
          set -euo pipefail
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"

      - name: API health check gate (optional)
        if: env.API_HEALTHCHECK_URL != ''
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS "$API_HEALTHCHECK_URL" > /dev/null; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 10
          done
          echo "API health check failed."
          exit 1

      - name: Collect deployment diagnostics
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo "environment=${{ github.event.inputs.environment }}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "deployment_id=${DEPLOYMENT_ID:-}"
            echo "api_image_uri=${API_IMAGE_URI:-}"
            echo "worker_image_uri=${WORKER_IMAGE_URI:-}"
          } > deployment-summary.txt

          if [[ -n "${DEPLOYMENT_ID:-}" ]]; then
            aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" > codedeploy-deployment.json || true
            aws deploy get-deployment-target \
              --deployment-id "$DEPLOYMENT_ID" \
              --target-id "$(aws deploy list-deployment-targets --deployment-id "$DEPLOYMENT_ID" --query 'targetIds[0]' --output text)" \
              > codedeploy-target.json || true
          fi

      - name: Upload backend-cd artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-cd-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: |
            deployment-summary.txt
            codedeploy-request.json
            appspec.json
            api-taskdef-current.json
            api-taskdef-next.json
            worker-taskdef-current.json
            worker-taskdef-next.json
            codedeploy-deployment.json
            codedeploy-target.json
