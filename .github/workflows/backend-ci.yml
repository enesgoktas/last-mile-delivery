name: backend-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "README.md"
      - "docs/operations/evidence/section11/**"
      - "infra/scripts/check_section11_evidence.sh"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/reusable-backend-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "README.md"
      - "docs/operations/evidence/section11/**"
      - "infra/scripts/check_section11_evidence.sh"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/reusable-backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-reusable:
    uses: ./.github/workflows/reusable-backend-ci.yml
