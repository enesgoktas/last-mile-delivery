name: infra-plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: infra-plan-${{ github.event.inputs.environment }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/aws
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Section 11 evidence guard
        run: ../../scripts/check_section11_evidence.sh

      - name: Ensure required Terraform/OIDC secrets exist
        run: |
          [ -n "${{ secrets.AWS_REGION }}" ] || { echo "Missing AWS_REGION"; exit 1; }
          [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ] || { echo "Missing AWS_ROLE_TO_ASSUME"; exit 1; }
          [ -n "${{ secrets.TF_STATE_BUCKET }}" ] || { echo "Missing TF_STATE_BUCKET"; exit 1; }
          [ -n "${{ secrets.TF_STATE_LOCK_TABLE }}" ] || { echo "Missing TF_STATE_LOCK_TABLE"; exit 1; }
          [ -n "${{ secrets.TF_DB_PASSWORD }}" ] || { echo "Missing TF_DB_PASSWORD"; exit 1; }
          [ -n "${{ secrets.TF_JWT_SECRET }}" ] || { echo "Missing TF_JWT_SECRET"; exit 1; }
          [ -n "${{ secrets.TF_WEBHOOK_SECRET_ENCRYPTION_KEY }}" ] || { echo "Missing TF_WEBHOOK_SECRET_ENCRYPTION_KEY"; exit 1; }
          [ -n "${{ secrets.TF_ALB_CERTIFICATE_ARN }}" ] || { echo "Missing TF_ALB_CERTIFICATE_ARN"; exit 1; }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write sensitive Terraform overrides
        run: |
          cat > ci-secrets.override.tfvars <<'VARS'
          db_password = "${{ secrets.TF_DB_PASSWORD }}"
          jwt_secret = "${{ secrets.TF_JWT_SECRET }}"
          webhook_secret_encryption_key = "${{ secrets.TF_WEBHOOK_SECRET_ENCRYPTION_KEY }}"
          alb_certificate_arn = "${{ secrets.TF_ALB_CERTIFICATE_ARN }}"
          VARS

      - name: Terraform fmt check
        run: terraform fmt -check -recursive | tee tf-fmt.log

      - name: Terraform init (remote backend)
        run: |
          terraform init \
            -backend-config="environments/${{ github.event.inputs.environment }}.backend.hcl" \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            | tee tf-init.log

      - name: Terraform validate
        run: terraform validate | tee tf-validate.log

      - name: Terraform plan
        run: |
          terraform plan \
            -input=false \
            -lock=true \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars.example" \
            -var-file="ci-secrets.override.tfvars" \
            -out=tfplan \
            | tee tf-plan.log

      - name: Render plan text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: |
            infra/terraform/aws/tfplan
            infra/terraform/aws/tfplan.txt
            infra/terraform/aws/tf-fmt.log
            infra/terraform/aws/tf-init.log
            infra/terraform/aws/tf-validate.log
            infra/terraform/aws/tf-plan.log
