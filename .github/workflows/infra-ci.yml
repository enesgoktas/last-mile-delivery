name: infra-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/**"
      - "README.md"
      - "docs/operations/evidence/section11/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/reusable-infra-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - "README.md"
      - "docs/operations/evidence/section11/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/reusable-infra-ci.yml"

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-reusable:
    uses: ./.github/workflows/reusable-infra-ci.yml
