name: web-cd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      app:
        description: "Which app to deploy"
        required: true
        type: choice
        options:
          - frontend
          - tracking
          - both

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-cd-${{ github.event.inputs.environment }}-${{ github.event.inputs.app }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ github.event.inputs.app == 'both' && fromJSON('["frontend","tracking"]') || fromJSON(format('["{0}"]', github.event.inputs.app)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.app }}/package-lock.json"

      - name: Ensure required secrets exist
        run: |
          [ -n "${{ secrets.AWS_REGION }}" ]            || { echo "Missing AWS_REGION";            exit 1; }
          [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]    || { echo "Missing AWS_ROLE_TO_ASSUME";    exit 1; }
          [ -n "${{ secrets.FRONTEND_S3_BUCKET }}" ]    || { echo "Missing FRONTEND_S3_BUCKET";    exit 1; }
          [ -n "${{ secrets.TRACKING_S3_BUCKET }}" ]    || { echo "Missing TRACKING_S3_BUCKET";    exit 1; }

      - name: Install
        run: npm ci
        working-directory: ${{ matrix.app }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.app }}
        env:
          # Vite inlines VITE_* env vars at build time.
          # Set per-environment variables in GitHub Environment secrets.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Select S3 bucket and CloudFront distribution
        id: target
        run: |
          if [[ "${{ matrix.app }}" == "frontend" ]]; then
            echo "S3_BUCKET=${{ secrets.FRONTEND_S3_BUCKET }}"             >> "$GITHUB_OUTPUT"
            echo "CF_DISTRIBUTION=${{ secrets.FRONTEND_CF_DISTRIBUTION }}" >> "$GITHUB_OUTPUT"
          else
            echo "S3_BUCKET=${{ secrets.TRACKING_S3_BUCKET }}"             >> "$GITHUB_OUTPUT"
            echo "CF_DISTRIBUTION=${{ secrets.TRACKING_CF_DISTRIBUTION }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync build output to S3
        run: |
          set -euo pipefail
          aws s3 sync ${{ matrix.app }}/dist "s3://${{ steps.target.outputs.S3_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          # index.html must never be cached by CDN so browsers always get the
          # latest entry point with correct asset hashes.
          aws s3 cp ${{ matrix.app }}/dist/index.html \
            "s3://${{ steps.target.outputs.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront distribution
        if: steps.target.outputs.CF_DISTRIBUTION != ''
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.target.outputs.CF_DISTRIBUTION }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Waiting for CloudFront invalidation $INVALIDATION_ID..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.target.outputs.CF_DISTRIBUTION }}" \
            --id "$INVALIDATION_ID"
          echo "Invalidation complete."

      - name: Collect deployment summary
        if: always()
        run: |
          {
            echo "app=${{ matrix.app }}"
            echo "environment=${{ github.event.inputs.environment }}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "s3_bucket=${{ steps.target.outputs.S3_BUCKET }}"
            echo "cf_distribution=${{ steps.target.outputs.CF_DISTRIBUTION }}"
          } > web-cd-summary-${{ matrix.app }}.txt

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-cd-${{ matrix.app }}-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: web-cd-summary-${{ matrix.app }}.txt
